  # These devices live on VLAN 10 (management). The scrape is the one flow that
  # crosses from VLAN 20 into VLAN 10, and it is read-only SNMP. Use SNMPv3 with
  # authPriv and a per-device credential -- SNMPv2c community strings are
  # plaintext passwords shared across a fleet, which is exactly what SDD 15.2
  # rules out.
  #
  # Needs prometheus/snmp_exporter with a generated snmp.yml.
