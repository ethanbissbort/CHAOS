# Prometheus -- infrastructure monitoring (SDD section 8.7).
#
# HONEST SCOPE, read this before adding panels that depend on it.
#
# Exactly one job below is live: Prometheus scraping itself. Everything else is
# commented out because the exporter it needs is not deployed, or because the
# target's address is an open item in the design package.
#
# The digital twin API does NOT currently expose /metrics. Process telemetry
# (ingest rate, dead letters, command outcomes, alarm counts, EMS state) is
# written to PostgreSQL by the platform itself and is read by Grafana through
# the PostgreSQL datasource, not through Prometheus. Prometheus's job here is
# the layer underneath: hosts, switches, UPS, PDUs, NetBotz, ZFS, backups.
#
# Addressing: data/homestead_asset_register.yaml deliberately records every
# management_ip as TBD. No target below invents one. Fill them in from the
# addressing plan when it exists (SDD 49 item 4 / docs/network-and-trust-boundaries.md).

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    site: homestead
    node_role: primary

# Alerting is intentionally not wired to Alertmanager. Operational alarms are
# the platform's job (SDD 14): they carry asset identity, severity, lifecycle,
# an operating procedure and an audit trail, none of which an Alertmanager
# notification has. Prometheus alerting is appropriate for infrastructure
# liveness only -- add it when there are exporters to alert on.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- Live -----------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          asset_id: it.application_service.rack_01.prometheus_01
          service: prometheus

  # --- Awaiting an exporter -------------------------------------------------

