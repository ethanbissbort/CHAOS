# Eclipse Mosquitto -- homestead telemetry and command bus (SDD section 8.2).
#
# Baseline required by the design:
#   - per-device or per-gateway credentials      -> password_file, allow_anonymous false
#   - access-control lists by topic prefix       -> acl_file
#   - retained messages for current-state topics -> retain_available true
#   - last-will messages for node availability   -> client-side, topic .../availability
#   - persistent session and message storage     -> persistence true
#   - TLS for routed or untrusted links          -> listener 8883 (see below)
#
# Files under /mosquitto/config/local are generated on the property and are NOT
# in the repository (SDD 15.2). Bootstrap them with deploy/mosquitto/README.md.

# ---------------------------------------------------------------------------
# Identity and authorisation
# ---------------------------------------------------------------------------
# Anonymous access is off. An unauthenticated publisher on the automation VLAN
# could otherwise assert any asset's state, and the platform would believe it.
allow_anonymous false

password_file /mosquitto/config/local/passwd
acl_file      /mosquitto/config/local/acl

# Refuse a client whose username does not match the certificate/identity it
# claims. Relevant once TLS client certificates are issued.
# use_identity_as_username true

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------
# Plaintext listener. Acceptable only on a switched, VLAN-separated link that
# never leaves the property (SDD 15.1). Everything routed or wireless belongs on
# the TLS listener.
listener 1883
protocol mqtt

# TLS listener. Enable once certificates exist in /mosquitto/config/local/certs.
# The design calls for TLS on routed or untrusted links (SDD 8.2); it is left
# commented rather than half-configured so the broker never starts with a
# listener that silently accepts plaintext on 8883.
#
# listener 8883
# protocol mqtt
# cafile   /mosquitto/config/local/certs/ca.crt
# certfile /mosquitto/config/local/certs/server.crt
# keyfile  /mosquitto/config/local/certs/server.key
# tls_version tlsv1.2
# require_certificate false          # set true once every gateway has a client cert
# use_identity_as_username false     # set true together with require_certificate

# WebSocket listener for browser dashboards. Off by default; a browser reaching
# the bus directly bypasses the API's audit trail (SDD 5.7).
# listener 9001
# protocol websockets

# ---------------------------------------------------------------------------
# Persistence and delivery
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Retained messages carry current state for late subscribers (SDD 8.2).
retain_available true

# Keep queued messages for disconnected persistent sessions. A field gateway on
# a flaky LoRa/Wi-Fi link must not lose its queued commands.
max_queued_messages 10000
queue_qos0_messages false
persistent_client_expiration 14d

# Bound resource use so one misbehaving node cannot exhaust the broker.
max_inflight_messages 40
max_packet_size 262144
max_keepalive 300

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# Connection/disconnection logging is the record of which gateway was alive
# when -- useful during the SDD 19 step 6 communications-loss test.
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# $SYS topics feed the broker health panel and the compose healthcheck.
sys_interval 10

# ---------------------------------------------------------------------------
# Bridge to the primary broker (secondary control node only)
# ---------------------------------------------------------------------------
# SDD 16.1 mitigation 6: the secondary node provides an MQTT bridge. Enable this
# block ONLY on the secondary node, and only with a dedicated bridge identity.
#
# Direction matters. `topic ... in ...` pulls telemetry from the primary so the
# secondary can observe and alert. There is deliberately no `out` rule for the
# command namespace: the secondary must never inject commands into the primary
# bus (SDD 5.3 -- supervisory control does not get to split-brain).
#
# connection primary-bridge
# address PRIMARY_BROKER_HOST:8883
# bridge_protocol_version mqttv311
# remote_username svc-bridge-secondary
# remote_password CHANGE_ME
# bridge_cafile /mosquitto/config/local/certs/ca.crt
# cleansession false
# start_type automatic
# restart_timeout 30
# notifications true
# notification_topic homestead/bridge/secondary/availability
#
# # Telemetry and events flow inward only.
# topic homestead/+/+/+/# in 1
# # Alarms raised on the primary are mirrored so the secondary can escalate.
# topic homestead/+/+/+/alarm/# in 1
# # NOTHING outbound. Do not add `out` rules for cmd/ or setpoint/.
