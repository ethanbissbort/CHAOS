extension_notes:
- Status concept everywhere. No water asset is planned in the procurement sense; the register reserves the identity so drawings,
  CAPEX, controls and commissioning records can reference the same object (rule 25.3.8).
- Irrigation zones use the agriculture domain, following the SDD section 25.2 worked example agriculture.irrigation_zone.orchard.03.
  The irrigation_zone class permits both water and agriculture.
- Two irrigation zones and two rainwater cisterns are pattern placeholders, not a survey. The real counts follow from a property
  that has not been selected.
- No tank volume, well yield, flow rate, pipe size, pressure or temperature threshold appears anywhere in this document. Every
  such value is TBD with an entry in the owning asset's open_fields.
- Electrical demand is not duplicated here. The register already carries energy.load.site.water_pumping_01 and energy.load.site.irrigation_01.
