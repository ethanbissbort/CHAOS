schema_version: 0.4.0
document_type: water_asset_extension
document_status: concept_extension_for_review
generated_at: '2026-08-07T00:00:00Z'
extends: homestead.primary.v0_3
merge_target: data/homestead_asset_register.yaml
site_id: site.site.primary.01
source_document: Homestead_Digital_Twin_Software_Design_Document_v0.3.md
work_queue_item: '49.5'
control_narrative: docs/water-control-narrative.md
purpose: 'The v0.3 asset register contains no water assets. This extension models the SDD section 3.4 water systems using
  the asset and relationship record shape of the base register so that merging it is a list concatenation. Every asset is
  status concept: nothing here has been sited, sized, specified or procured.'
merge_rules:
- Asset records use the identical field set and ordering as data/homestead_asset_register.yaml.
- Relationship IDs start at rel.1001 so they cannot collide with the base register's rel.0001-rel.0099.
- Parent and relationship endpoints may reference base-register assets; the reverse is not true until merge.
- Asset classes are used only where data/asset_class_dictionary.yaml already defines them. No class was invented.
asset_class_gaps:
- needed_for: Rainwater catchment surface (roof or other collection area)
  missing_class: catchment_surface
  workaround: The collection subsystem is modelled by its diverter, screen, inflow meter and cisterns only.
- needed_for: Pipe or line segments for routing, freeze exposure and leak localisation
  missing_class: pipe_segment
  workaround: Line identity is carried in each valve's served_line property; there is no routable pipe graph.
- needed_for: Distribution manifold or header as a physical object
  missing_class: manifold
  workaround: Modelled as the irrigation main valve plus its downstream zone valves.
- needed_for: Freeze-protection heat-trace circuit
  missing_class: heat_trace_circuit
  workaround: Heat trace is an electrical load; it belongs in the energy domain as an energy.load asset and in the load schedule,
    not in this water extension.
- needed_for: A generic non-well water source such as a spring, surface intake or delivered water
  missing_class: water_source
  workaround: Only the well class exists; rainwater is represented by its storage and inflow metering.
design_basis:
  authoritative_design_document: Homestead_Digital_Twin_Software_Design_Document_v0.3.md
  design_stage: concept_only_no_water_infrastructure_exists
  requirements_covered:
  - FR-200
  - FR-201
  - FR-202
  - FR-203
  - FR-204
  - FR-205
  unresolved:
  - Property location, terrain, aquifer and climate, which govern every water decision.
  - Well depth, static level, drawdown behaviour and sustainable yield.
  - Roof and catchment areas, rainfall record and therefore cistern sizing.
  - Raw-water chemistry, and therefore the required treatment train.
  - Pipe routing, burial depth, frost depth and line slope for winter drainage.
  - Household and irrigation demand, and therefore the emergency potable reserve volume.
  - Graywater reuse permissions in the final jurisdiction.
asset_class_usage:
  controller: 3
  filter: 5
  flow_meter: 5
  graywater_branch: 1
  irrigation_zone: 2
  pressure_sensor: 3
  pump: 5
  safety_sensor: 2
  sensor: 3
  tank: 6
  treatment_stage: 2
  valve: 9
  well: 1
