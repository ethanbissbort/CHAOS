relationship_types:
  contains: Physical or logical containment.
  located_in: Geographic or structural location.
  feeds: Supplies energy, water, data or material.
  returns_to: Return path.
  controls: Controller owns a process output.
  monitors: Sensor or service observes an asset.
  protects: Protection device acts on equipment.
  depends_on: Operational dependency.
  backs_up: Redundant or alternate resource.
  measures: Meter or sensor association.
  serves: Utility or service supports an end-use system.
  part_of: Functional grouping.
  associated_with: Non-flow contextual link.
  replaces: Asset lifecycle succession.
  connected_to: Physical or logical connectivity where a directional flow is not asserted.
  hosts: Compute or enclosure asset hosts a software service or virtualized asset.
  managed_by: Device is managed by a controller or management service.
