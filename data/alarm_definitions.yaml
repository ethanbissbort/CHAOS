    probable_causes:
      - Rack cooling shed as a load or failed.
      - Shared uncontrolled airflow path with the battery zone.
      - Compute workload not shifted despite thermal constraint (FR-804).
    automatic_action: None from the alarm engine.
    operator_action: Restore cooling, suspend discretionary compute, and verify the two zones are not sharing airflow.
    procedure_ref: OP-IT-SERVER-ZONE-THERMAL
