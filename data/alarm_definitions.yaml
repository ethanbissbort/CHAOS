    trigger_expression: storage_used_pct > 85 % held 900 s; clears at <= 80 % held 900 s
    threshold_status: commissioning_default
    threshold_basis: >-
      85 % / 80 % is a conventional starting pair, not a decided policy. SDD 22 item 10 leaves
