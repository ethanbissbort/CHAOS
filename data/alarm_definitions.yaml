  - alarm_key: backup_overdue
    name: Configuration and database backup overdue
    severity: warning
    domain: it
    asset_id: it.application_service.rack_01.postgres_01
    point_name: backup_age_h
    trigger:
      operator: gt
      value: 48
    reset:
      operator: le
      value: 24
    hysteresis: 24
    on_delay_s: 300
    off_delay_s: 300
    trigger_expression: backup_age_h > 48 h held 300 s; clears at <= 24 h held 300 s
    threshold_status: commissioning_default
    threshold_basis: >-
      FR-805 requires automatic backup of network-device and platform configuration but sets no
      interval, and SDD 22 item 9 leaves the offsite-backup architecture undefined. A 24 h
      target with a 48 h alarm is a starting pair only.
    requires_manual_reset: false
    maintenance_mode_behaviour: suppress
    parent_alarm_key: null
    parent_scope: related
    data_quality_alarm_key: sensor_data_invalid
    affected_assets:
      - it.application_service.rack_01.postgres_01
      - it.server.secondary_control_node.01
    probable_causes:
      - Backup job failed or was never scheduled.
      - Target volume full or unreachable.
      - Credentials expired.
    automatic_action: None.
    operator_action: >-
      Restore the backup job. SDD 16.1 mitigation 3 requires critical configuration and asset
      data to be replicated outside the power container, so an overdue backup is a common-mode
      exposure, not just housekeeping.
    procedure_ref: OP-IT-BACKUP-OVERDUE
    procedure_status: not_yet_written
    escalation_path:
      - stage: 1
        after_s: 0
        channels: [log]
        role: operator
      - stage: 2
        after_s: 86400
        channels: [email]
        role: maintainer
    renotify_after_s: 0
    suppression_conditions:
      - type: operating_mode
        scope: asset
        modes: [maintenance, 'off']
        description: Backup deliberately paused.
    correlation:
      window_s: 3600
      flood_threshold: 3
    source_sections: ['12.9', '16.1']
    enabled: true

  - alarm_key: time_sync_drift
    name: Host clock offset high
    severity: warning
    domain: it
    asset_class: server
    point_name: clock_offset_ms
    trigger:
      operator: gt
      value: 1000
    reset:
      operator: le
      value: 250
    hysteresis: 750
    on_delay_s: 600
    off_delay_s: 600
    trigger_expression: clock_offset_ms > 1000 ms held 600 s; clears at <= 250 ms held 600 s
    threshold_status: commissioning_default
    threshold_basis: >-
      SDD 16.3 requires every host, gateway, PLC, camera and field node to use the homestead
      NTP service but states no tolerance. One second alarm / 250 ms reset is a starting band.
    requires_manual_reset: false
    maintenance_mode_behaviour: suppress
    parent_alarm_key: null
    parent_scope: related
    data_quality_alarm_key: sensor_data_invalid
    affected_assets:
      - it.server.rack_01.r740xd_01
      - it.server.secondary_control_node.01
    probable_causes:
      - NTP service unreachable and holdover drifting.
      - External time source lost while isolated.
      - Virtualization clock drift.
    automatic_action: None.
    operator_action: >-
      Fix time before trusting any correlated timeline. Alarm and command audit records are
      retained indefinitely (SDD 16.4) and are worth less with a skewed clock.
    procedure_ref: OP-IT-TIME-SYNC
    procedure_status: not_yet_written
    escalation_path:
      - stage: 1
        after_s: 0
        channels: [log]
        role: operator
      - stage: 2
        after_s: 21600
        channels: [email]
        role: maintainer
    renotify_after_s: 0
    suppression_conditions:
      - type: operating_mode
        scope: asset
        modes: [maintenance, 'off']
        description: Host under service.
    correlation:
      window_s: 3600
      flood_threshold: 3
    source_sections: ['16.3']
    enabled: true

  # -- Security, SDD 12.10 -----------------------------------------------

  - alarm_key: rack_door_forced_open
    name: Rack door forced open
    severity: major
    domain: security
    asset_id: security.access_controller.rack_01.ap9361_01
    point_name: forced_open_active
    trigger:
      operator: eq
      value: true
    reset:
      operator: eq
      value: false
    hysteresis: null
    on_delay_s: 0
    off_delay_s: 0
    trigger_expression: forced_open_active == true, no delay
    threshold_status: not_applicable
    threshold_basis: Boolean forced-entry state from the rack access controller.
    requires_manual_reset: true
    maintenance_mode_behaviour: notify_only
    parent_alarm_key: null
    parent_scope: related
    data_quality_alarm_key: sensor_data_invalid
    affected_assets:
      - security.access_controller.rack_01.ap9361_01
      - it.rack.power_container.01
      - security.camera.rack_01.netbotz_01
    probable_causes:
      - Unauthorized physical access.
      - Door opened without a valid card read.
      - Latch or sensor fault.
    automatic_action: None. The local access controller and beacon act independently.
    operator_action: >-
      Correlate against camera, motion and access-card events per FR-902 before treating it as
      a sensor fault. Preserve the footage.
    procedure_ref: OP-SECURITY-RACK-FORCED-ENTRY
    procedure_status: not_yet_written
    escalation_path:
      - stage: 1
        after_s: 0
        channels: [log, email, push]
        role: operator
      - stage: 2
        after_s: 300
        channels: [voice]
        role: on_call
    renotify_after_s: 900
    suppression_conditions: []
    correlation:
      window_s: 900
      flood_threshold: 2
      is_root_candidate: true
    source_sections: ['12.10']
    enabled: true
    notes:
      - requires_manual_reset so a forced-entry event cannot disappear when the door is closed again.

  - alarm_key: rack_door_open_extended
    name: Rack door left open
    severity: warning
    domain: security
    asset_id: security.access_controller.rack_01.ap9361_01
    point_name: door_state
    trigger:
      operator: eq
      value: open
    reset:
      operator: in
      values: [closed, ajar]
    hysteresis: null
    on_delay_s: 600
    off_delay_s: 30
    trigger_expression: door_state == open held 600 s
    threshold_status: commissioning_default
    threshold_basis: >-
      10 minutes is a placeholder for "longer than a normal visit". No access policy has been
      written yet.
    requires_manual_reset: false
    maintenance_mode_behaviour: suppress
    parent_alarm_key: rack_door_forced_open
    parent_scope: same_asset
    data_quality_alarm_key: sensor_data_invalid
    affected_assets:
      - security.access_controller.rack_01.ap9361_01
      - it.rack.power_container.01
      - structure.room.power_container.server_zone
    probable_causes:
      - Work in progress with the door left open.
      - Door not latched.
      - Airflow deliberately altered during a thermal event.
    automatic_action: None.
    operator_action: Close and latch the door; an open rack door changes the server-zone airflow assumptions.
    procedure_ref: OP-SECURITY-RACK-DOOR
    procedure_status: not_yet_written
    escalation_path:
      - stage: 1
        after_s: 0
        channels: [log]
        role: operator
      - stage: 2
        after_s: 3600
        channels: [email]
        role: operator
    renotify_after_s: 0
    suppression_conditions:
      - type: operating_mode
        scope: asset
        modes: [maintenance]
        description: Rack access expected while a work order is open.
    correlation:
      window_s: 900
      flood_threshold: 3
    source_sections: ['12.10']
    enabled: true
    notes:
      - 'The canonical maintenance-suppression example: rack work makes this alarm certain and useless.'

  - alarm_key: camera_tamper
    name: Camera tamper detected
    severity: major
    domain: security
    asset_class: camera
    point_name: tamper_active
    trigger:
      operator: eq
      value: true
    reset:
      operator: eq
      value: false
    hysteresis: null
    on_delay_s: 10
    off_delay_s: 60
    trigger_expression: tamper_active == true held 10 s
    threshold_status: not_applicable
    threshold_basis: Boolean tamper state.
    requires_manual_reset: true
    maintenance_mode_behaviour: notify_only
    parent_alarm_key: null
    parent_scope: related
    data_quality_alarm_key: sensor_data_invalid
    affected_assets:
      - security.camera.rack_01.netbotz_01
      - it.rack.power_container.01
    probable_causes:
      - Camera physically moved, covered or obstructed.
      - Lens defocused or sprayed.
      - Mount vibration misread as tamper.
    automatic_action: None.
    operator_action: Preserve footage from before the tamper event and correlate with access and motion events (FR-902).
    procedure_ref: OP-SECURITY-CAMERA-TAMPER
    procedure_status: not_yet_written
    escalation_path:
      - stage: 1
        after_s: 0
        channels: [log, email, push]
        role: operator
      - stage: 2
        after_s: 900
        channels: [voice]
        role: on_call
    renotify_after_s: 1800
    suppression_conditions: []
    correlation:
      window_s: 900
      flood_threshold: 2
    source_sections: ['12.10']
    enabled: true

  - alarm_key: camera_offline
    name: Camera offline
    severity: warning
    domain: security
    asset_class: camera
    point_name: availability_state
    trigger:
      operator: in
      values: [offline, unknown]
    reset:
      operator: eq
      value: online
    hysteresis: null
    on_delay_s: 120
    off_delay_s: 60
    trigger_expression: availability_state in {offline, unknown} held 120 s
    threshold_status: not_applicable
    threshold_basis: Enumerated availability state.
    requires_manual_reset: false
    maintenance_mode_behaviour: suppress
    parent_alarm_key: core_switch_unreachable
    parent_scope: related
    data_quality_alarm_key: sensor_data_invalid
    affected_assets:
      - security.camera.rack_01.netbotz_01
      - it.network_segment.site.vlan_40
    probable_causes:
      - VLAN 40 path lost.
      - PoE or camera power lost.
      - NVR or service path unavailable.
    automatic_action: None.
    operator_action: >-
      Check the camera VLAN before the camera. FR-901 keeps camera traffic in VLAN 40 and
      retrieval on approved paths only.
    procedure_ref: OP-SECURITY-CAMERA-OFFLINE
    procedure_status: not_yet_written
    escalation_path:
      - stage: 1
        after_s: 0
        channels: [log]
        role: operator
      - stage: 2
        after_s: 3600
        channels: [email]
        role: operator
    renotify_after_s: 0
    suppression_conditions:
      - type: operating_mode
        scope: asset
        modes: [maintenance, 'off']
        description: Camera deliberately offline.
    correlation:
      window_s: 1800
      flood_threshold: 3
    source_sections: ['12.10']
    enabled: true

  - alarm_key: alarm_beacon_unavailable
    name: Local alarm beacon unavailable
    severity: major
    domain: safety
    asset_id: safety.alarm_output.rack_01.beacon_01
    point_name: availability_state
    trigger:
      operator: in
      values: [offline, unknown]
    reset:
      operator: eq
      value: online
    hysteresis: null
    on_delay_s: 120
    off_delay_s: 60
    trigger_expression: availability_state in {offline, unknown} held 120 s
    threshold_status: not_applicable
    threshold_basis: Enumerated availability state.
    requires_manual_reset: false
    maintenance_mode_behaviour: notify_only
    parent_alarm_key: null
    parent_scope: any
    data_quality_alarm_key: sensor_data_invalid
    affected_assets:
      - safety.alarm_output.rack_01.beacon_01
      - it.environmental_monitor.rack_01.nbrk0550_01
      - it.rack.power_container.01
    probable_causes:
      - Beacon power or wiring lost.
      - NetBotz rack monitor offline.
      - Output relay failed.
    automatic_action: None.
    operator_action: >-
      Restore local annunciation promptly. SDD 16.1 mitigation 4 requires essential alerts to
      be able to originate from independent local devices, so a dead beacon removes the alerting
      path that survives loss of this platform.
    procedure_ref: OP-SAFETY-BEACON
    procedure_status: not_yet_written
    escalation_path:
      - stage: 1
        after_s: 0
        channels: [log, email]
        role: operator
      - stage: 2
        after_s: 1800
        channels: [push]
        role: maintainer
    renotify_after_s: 7200
    suppression_conditions:
      - type: operating_mode
        scope: asset
        modes: ['off']
        description: Beacon decommissioned.
    correlation:
      window_s: 1800
      flood_threshold: 2
    source_sections: ['16.1', '12.10']
    enabled: true
    notes:
      - Deliberately parentless with parent_scope "any". The independent alerting path must not be
        reported as a silent symptom of the outage it exists to survive.

  # -- Platform data quality, SDD 26.6 / FR-003 --------------------------

  - alarm_key: sensor_data_invalid
    name: Sensor measurement bad or stale
    severity: warning
    domain: platform
    asset_id: null
    asset_class: null
    point_name: null
    trigger:
      operator: quality_in
      values: [bad, stale]
    reset:
      operator: not_in
      values: [bad, stale]
    hysteresis: null
    on_delay_s: 300
    off_delay_s: 300
    trigger_expression: >-
      Raised by the evaluator against the specific point whose quality is bad or stale when a
      non-energy alarm would otherwise have used that value.
    threshold_status: not_applicable
    threshold_basis: >-
      Quality-driven. A dead sensor is a dead sensor, not a healthy in-range reading (SDD 26.6).
    requires_manual_reset: false
    maintenance_mode_behaviour: suppress
    parent_alarm_key: null
    parent_scope: any
    data_quality_alarm_key: null
    affected_assets: []
    probable_causes:
      - Sensor, gateway or environmental monitor offline.
      - Point binding not commissioned; binding_status still tbd (SDD 47).
      - Polling interval longer than stale_after_s.
      - MQTT bridge outage.
    automatic_action: The dependent alarm is held rather than evaluated on untrustworthy data.
    operator_action: Restore the measurement path, then re-enable the dependent alarm's decision.
    procedure_ref: OP-PLATFORM-DATA-QUALITY
    procedure_status: not_yet_written
    escalation_path:
      - stage: 1
        after_s: 0
        channels: [log]
        role: operator
      - stage: 2
        after_s: 86400
        channels: [email]
        role: maintainer
    renotify_after_s: 0
    suppression_conditions:
      - type: operating_mode
        scope: asset
        modes: [maintenance]
        description: Device intentionally unavailable or under test.
    correlation:
      window_s: 1800
      flood_threshold: 5
    source_sections: ['26.6', '12.1', '47']
    enabled: true
    notes:
      - Instantiated dynamically against whichever point went bad; it has no fixed asset scope.
